name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.os }} / go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.24", "1.25"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Adversarial suite
        run: go test ./internal/adversarial/ -v

  dogfood:
    name: dogfood
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: go build -o grokinstall ./cmd/grokinstall
      - name: doctor
        run: ./grokinstall doctor
      - name: inspect itself
        run: ./grokinstall inspect .
      - name: plan itself
        run: ./grokinstall plan . --goal "Allow GrokBot to diagnose GrokInstall"
      - name: compare itself
        run: ./grokinstall compare . --goal "Allow GrokBot to diagnose GrokInstall"
      - name: version
        run: ./grokinstall version --json

  # Live network tests are opt-in and never block ordinary CI. Run them from the
  # Actions interface, or locally with GROKINSTALL_NETWORK_TESTS=1.
  network:
    name: live network (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Public GitHub inspection
        run: go test ./internal/inspect/ -run PublicGitHubSource -v
        env:
          GROKINSTALL_NETWORK_TESTS: "1"
